# SonarCloud automatic analysis settings.
#
# Excluded from copy-paste detection only; both are still analysed for bugs,
# vulnerabilities and code smells:
# - de/**: the German pages mirror the English pages line for line (same
#   markup, same code samples).
# - includes/benchmarks-data.php: one immutable benchmark snapshot per run,
#   each with the same array layout by design, so every new snapshot reads
#   as a copy of the previous one.
sonar.cpd.exclusions=de/**,includes/benchmarks-data.php
