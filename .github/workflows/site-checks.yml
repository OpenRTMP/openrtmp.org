name: Website checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Full history: sitemap <lastmod> values come from commit dates.
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Lint PHP files
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate sitemap XML
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
          xmllint --noout sitemap.xml

      - name: Check sitemap matches git history
        run: |
          expected=$(mktemp)
          scripts/generate-sitemap.sh -o "$expected"
          if ! diff -u sitemap.xml "$expected"; then
            echo
            echo "sitemap.xml is out of date. Run scripts/generate-sitemap.sh and commit the result."
            exit 1
          fi

      - name: Smoke-test public pages
        run: |
          php -S 127.0.0.1:8090 >/tmp/openrtmp-site.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 2
          # Every page on disk, English and German, must render.
          for page in $(find . -name 'index.php' -not -path './includes/*' | sed 's|^\./||; s|index\.php$||' | sort); do
            path="/${page}"
            curl --fail --silent --show-error "http://127.0.0.1:8090${path}" >/dev/null
          done
