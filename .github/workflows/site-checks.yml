name: Website checks

on:
  pull_request:
  push:
    branches:
      - main
  # Deploy to production runs these checks first and only uploads when they pass.
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Full history: sitemap <lastmod> values come from commit dates.
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Lint PHP files
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate sitemap XML
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
          xmllint --noout sitemap.xml

      - name: Check sitemap matches git history
        run: |
          expected=$(mktemp)
          scripts/generate-sitemap.sh -o "$expected"
          if ! diff -u sitemap.xml "$expected"; then
            echo
            echo "sitemap.xml is out of date. Run scripts/generate-sitemap.sh and commit the result."
            exit 1
          fi

      - name: Smoke-test public pages
        run: |
          # Log every PHP diagnostic instead of printing it into the page, so a
          # warning or deprecation fails the job instead of rendering as a 200.
          php_errors=/tmp/openrtmp-php-errors.log
          rm -f "$php_errors"
          php -d display_errors=0 -d log_errors=1 -d error_reporting=-1 \
            -d error_log="$php_errors" \
            -S 127.0.0.1:8090 scripts/dev-router.php >/tmp/openrtmp-site.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for _ in $(seq 50); do
            curl --silent --output /dev/null http://127.0.0.1:8090/ && break
            sleep 0.1
          done
          # Every page on disk, English and German, must render.
          # './index.php' -> '/', './de/guides/x/index.php' -> '/de/guides/x/'
          paths=$(find . -name 'index.php' -not -path './includes/*' | sed 's|^\.||; s|index\.php$||' | sort)
          for path in $paths; do
            curl --fail --silent --show-error "http://127.0.0.1:8090${path}" >/dev/null
          done
          # Internal links and #anchors on those pages must resolve.
          # shellcheck disable=SC2086
          python3 scripts/check-links.py http://127.0.0.1:8090 $paths
          if [ -s "$php_errors" ]; then
            echo "PHP reported diagnostics while rendering the pages:"
            cat "$php_errors"
            exit 1
          fi
