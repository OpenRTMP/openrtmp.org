<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<title>Page not found — OpenRTMP</title>
<style>
  :root {
    --bg: #0a0e14;
    --surface: #131a24;
    --border: #232d3b;
    --text: #e6edf3;
    --text-dim: #92a2b3;
    --accent: #ff5c35;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  main { max-width: 620px; }
  .code {
    font-size: clamp(3.5rem, 12vw, 6rem);
    font-weight: 600;
    line-height: 1;
    color: var(--accent);
    margin-bottom: 1rem;
  }
  h1 { font-size: clamp(1.4rem, 4vw, 2rem); margin-bottom: 0.75rem; }
  p { color: var(--text-dim); margin-bottom: 1.75rem; }
  nav { display: flex; flex-wrap: wrap; gap: 0.75rem; }
  a {
    display: inline-block;
    padding: 0.65rem 1.1rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    text-decoration: none;
    font-size: 0.95rem;
  }
  a:hover, a:focus-visible { border-color: var(--accent); }
  a.primary { background: var(--accent); border-color: var(--accent); color: #0a0e14; font-weight: 600; }
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <h1>This page does not exist</h1>
  <p>
    The address may be mistyped or the page may have moved. The links below lead
    back to the documentation, the guides, and the quickstart.
  </p>
  <nav aria-label="Suggested pages">
    <a class="primary" href="/">Home</a>
    <a href="/quickstart/">Quickstart</a>
    <a href="/guides/">Guides</a>
    <a href="/docs/">Docs</a>
    <a href="/de/" hreflang="de" lang="de">Deutsch</a>
  </nav>
</main>
</body>
</html>
